<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Databook App</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      color: white;
    }
    h1 {
      text-align: center;
      margin-bottom: 10px;
    }
    p.subtitle {
      text-align: center;
      opacity: 0.9;
      margin-bottom: 30px;
    }
    .app-container {
      background: white;
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    }
    table {
      border-collapse: collapse;
      width: 100%;
      margin-bottom: 20px;
      background: white;
    }
    th, td {
      border: 2px solid #e2e8f0;
      padding: 12px 10px;
      text-align: left;
    }
    th {
      background: #34d399;
      color: white;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 14px;
      letter-spacing: 0.5px;
    }
    tr:hover {
      background-color: #e8f4fd !important;
      border-left: 4px solid #3b82f6 !important;
      transform: translateX(2px);
      transition: all 0.2s ease;
    }
    tr.selected {
      background-color: #d1ecf1 !important;
      border-left: 4px solid #0d6efd !important;
      font-weight: 600;
    }
    button {
      padding: 8px 16px;
      margin: 5px 3px 5px 0;
      cursor: pointer;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      transition: all 0.2s;
    }
    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }
    button:active {
      transform: translateY(0);
    }
    .btn-add {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: white;
    }
    .btn-delete {
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      color: white;
    }
    .btn-edit {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: white;
    }
    .actions-cell {
      text-align: right;
    }
    .info-text {
      font-size: 14px;
      line-height: 1.4;
    }
    .footer {
      text-align: center;
      padding-top: 20px;
      margin-top: 20px;
      border-top: 1px solid rgba(0, 0, 0, 0.1);
      font-size: 14px;
    }
    .footer a {
      color: #3b82f6;
      text-decoration: none;
    }
    .footer a:hover {
      text-decoration: underline;
    }
    .loading {
      text-align: center;
      padding: 40px;
      font-style: italic;
      color: #6b7280;
    }
    .error-message {
      background: #fee2e2;
      border-left: 4px solid #ef4444;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <h1>Welcome to Databook!</h1>
  <p class="subtitle">A secure Node.js web application with SQLite persistence</p>
  
  <div id="app" class="app-container">
    <!-- Error message container -->
    <div id="errorMessage" class="error-message" style="display: none;">
      <strong>Error:</strong> <span id="errorText"></span>
    </div>
    
    <!-- Activity Log Table -->
    <table id="activityTable">
      <thead>
        <tr>
          <th style="width: 30%;">Date</th>
          <th style="width: 55%;">Information</th>
          <th style="width: 15%;"></th>
        </tr>
      </thead>
      <tbody id="activityList">
        <!-- Rows will be loaded here -->
      </tbody>
    </table>
    
    <!-- Action Buttons -->
    <div style="margin-top: 20px; padding-top: 20px; border-top: 1px solid #e2e8f0;">
      <button class="btn-add" onclick="addRow()">➕ Add</button>
      <button class="btn-edit" onclick="editSelected()">✏️ Edit Selected</button>
      <button class="btn-delete" onclick="deleteSelected()">🗑️ Delete Selected</button>
    </div>
    
    <!-- Footer -->
    <div class="footer">
      <a href="/health">Check Health Status</a> | 
      <a href="/static/data.js">View Source Code</a>
    </div>
  </div>

  <!-- Load the main JavaScript file -->
  <script src="/static/data.js"></script>
</body>
</html>
